name: Bug report
description: Report reproducible CI replay, source-adapter or library behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: checkboxes
    id: non_api
    attributes:
      label: Confirm this is an issue with the coleman library.
      description: Issues relevant to other tools should be directed to their respective repositories.
      options:
        - label: This is an issue with the coleman library
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is, and any additional context.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Fetch a '...'
        2. Update the '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: code-snippets
    attributes:
      label: Code snippets
      description: If applicable, add code snippets to help explain your problem.
      render: Python
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS
    validations:
      required: true
  - type: input
    id: language-version
    attributes:
      label: Python version
      placeholder: Python 3.14.x
    validations:
      required: true
  - type: input
    id: lib-version
    attributes:
      label: Library version
      placeholder: Installed COLEMAN version and wheel/source revision
    validations:
      required: true
  - type: textarea
    id: experiment-context
    attributes:
      label: Experiment or source context
      description: Include a minimal redacted RunSpec or command, source preset, and relevant artifact/schema/producer identities when available. Do not attach credentials or private datasets.
    validations:
      required: false
