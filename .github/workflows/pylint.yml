name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Retrieve full commit history for proper diff.
      - name: Install verified uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.14
          uv sync --frozen --extra dev --group build --no-build --no-install-project

      - name: Run ruff linter
        run: uv run --frozen --no-sync --no-build ruff check .

      - name: Run ruff formatter check
        run: uv run --frozen --no-sync --no-build ruff format --check .

      - name: Check NumPy parameter documentation at public entry points
        run: make docstrings
