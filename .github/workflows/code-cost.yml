name: Code Cost — Structural checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  structural-cost:
    name: Structural cost gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install verified uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          python-version: '3.14'
          enable-cache: true

      - name: Create venv (Python 3.14)
        run: |
          uv python install 3.14
          uv venv .venv --python 3.14

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --group build --no-build --no-install-project
          uv pip install --no-deps --no-build --no-build-isolation --editable .

      - name: Xenon complexity gate
        run: make cost-xenon

      - name: Radon maintainability index gate
        run: make cost-maintainability

      - name: Radon cyclomatic complexity report
        if: always()
        run: make cost-complexity
